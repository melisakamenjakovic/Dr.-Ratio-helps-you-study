<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dr. Ratio's Classroom</title>
    
</head>
<body>
  <main class="game-container">
    <h1>Dr. Ratio's Classroom</h1>
    <p id="story">
      Breatlessly you open the door to the lecture hall only to be greeted by a scrutinizing gaze.
    </p>
    <div id="choices">
      <button onclick="choose(1)">Well hello there cutie</button>
      <button onclick="choose(2)">uhh sorry doctor</button>
      <button onclick="choose(3)">Fuck you</button>
    </div>
  </main>
  <script>
    function choose(option) {
      const story = document.getElementById("story");
      const choices = document.getElementById("choices");
      if (option === 1) {
        story.textContent =
          "...If this is any indication of your academic performance i fear we are in for a rather dissapointing semester";
        choices.innerHTML = `
          <button onclick="choose(4)">Six sevennnn</button>

          <button onclick="choose(5)">*Stay silent*</button>
        `;
      } else if (option === 2) {
        story.textContent =
          "See that it doesent happen again.";
        choices.innerHTML = `
          <button onclick="choose(4)">Six sevennnn</button>
          <button onclick="choose(5)">*Stay silent*</button>
        `;
      } else if (option === 3){ 
        story.textContent =
          "And yet, somehowy I doubt you suspect you would struggle to complete even that task on time.";
        choices.innerHTML = `
        <button onclick="choose(4)">Six sevennnn</button>
        <button onclick="choose(5)">*Stay silent*</button>
        `;
      } else if (option === 4) {
        story.textContent ="*Throws chalk at you* FAIL. ZERO POINTS.";
        choices.innerHTML = `
          <button onclick="restartGame()">Play again</button>
        `;
      } else if (option===5){
        story.textContent ="Good. Lets continue with the lesson.";
        choices.innerHTML=`
        <button onclick="restartGame()">Play again</button>
        `;
    }
    }
    function restartGame() {
      location.reload();
    }
     </script>
</body>
</html>
